[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://images.unsplash.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://www.gstatic.com https://js.paystack.co; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://api.paystack.co; frame-src https://checkout.paystack.com https://js.paystack.co; base-uri 'self'; form-action 'self'; object-src 'none'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/wgh/:splat"
  status = 200
